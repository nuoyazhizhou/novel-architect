name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        # Pillow 只给头像生成/规格检查用；单测自己用手工 PNG 头，不需要中文字体。
        run: python -m pip install --upgrade pip pytest pillow

      - name: Unit tests
        # 15 例：包边界、team 元数据自洽、头像规格、漂移与写穿防御。
        run: python -m pytest tests/ -q

      - name: Avatar spec
        # 6 张 512x512 PNG、单张 < 500KB。不重生成（CI 上没有 Windows 中文字体）。
        run: python tools/gen_avatars.py --check

      - name: Source integrity
        run: python tools/mount.py --check-source
